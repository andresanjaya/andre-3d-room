<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andre Archive Room</title><style>body{margin:0;background:#241c32;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}button{position:fixed;top:20px;left:20px;background:#eee5dc;border:0;border-radius:6px;width:40px;height:40px;font-size:24px;cursor:pointer}button[hidden]{display:none}</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><button id="back" title="Back to room" aria-label="Back to room" hidden>&#8592;</button><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#241c32');scene.add(new THREE.HemisphereLight('#ffffff','#939b98',1.8));
const camera=new THREE.PerspectiveCamera(36,1,.1,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minPolarAngle=.45;controls.maxPolarAngle=1.45;controls.minAzimuthAngle=-.05;controls.maxAzimuthAngle=1.4;controls.enablePan=false;controls.minDistance=.6;controls.maxDistance=45;
const home=new THREE.Vector3();let moving=false,destination=new THREE.Vector3(),target=new THREE.Vector3(),selected=null;const meshes=[];
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();home.set(7.7,6.8,9).multiplyScalar(Math.max(1,1.1/camera.aspect));if(!selected){moving=false;controls.enabled=true;camera.position.copy(home);controls.target.set(0,1,0);}}addEventListener('resize',resize);resize();
const gltf=await new GLTFLoader().loadAsync('./andre-archive-room.glb');scene.add(gltf.scene);gltf.scene.traverse(o=>{if(o.userData.interactive)meshes.push(o);if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}if(o.isDirectionalLight){o.castShadow=true;o.shadow.mapSize.set(2048,2048);Object.assign(o.shadow.camera,{left:-4,right:4,top:4,bottom:-4});o.shadow.bias=-.0004;}});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let start={x:0,y:0};
function hit(e){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);let o=ray.intersectObjects(gltf.scene.children,true)[0]?.object;while(o){if(o.userData.interactive)return o;o=o.parent;}return null;}
renderer.domElement.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointermove',e=>{renderer.domElement.style.cursor=hit(e)?'pointer':'grab';});
renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)return;const m=hit(e);if(!m)return;selected=m;const bounds=new THREE.Box3().setFromObject(m);bounds.getCenter(target);const size=bounds.getSize(new THREE.Vector3()).length();const distance=Math.max(.7,size*1.55)*(camera.aspect<1?1.5:1);destination.copy(target).add(new THREE.Vector3(.18,.35,1).normalize().multiplyScalar(distance));moving=true;controls.enabled=false;document.querySelector('#back').hidden=false;window.lastSelected=m.name;});
function reset(){selected=null;target.set(0,1,0);destination.copy(home);moving=true;controls.enabled=false;document.querySelector('#back').hidden=true;}document.querySelector('#back').onclick=reset;addEventListener('keydown',e=>{if(e.key==='Escape')reset();});
renderer.setAnimationLoop(()=>{if(moving){camera.position.lerp(destination,.075);controls.target.lerp(target,.075);if(camera.position.distanceTo(destination)<.005){moving=false;controls.enabled=true;}}controls.update();renderer.render(scene,camera);});window.roomReady=true;window.roomDebug={meshes:meshes.map(m=>m.name),project(name){const v=new THREE.Box3().setFromObject(meshes.find(m=>m.name===name)).getCenter(new THREE.Vector3()).project(camera);return{x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight};}};
</script></body></html>
